[package]
name = "beautyxt-diagram-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
beautyxt-illustration-core = { path = "../illustration-core" }
merman = { version = "=0.11.0", default-features = false, features = [
    "svg",
    "diagram-flowchart",
    "diagram-sequence",
    "diagram-state",
    "diagram-class",
    "diagram-er",
    "diagram-pie",
    "diagram-git-graph",
    "diagram-requirement",
    "diagram-packet",
    "diagram-quadrant-chart",
    "diagram-xychart",
    "diagram-block",
] }
merman-render = { version = "=0.11.0", default-features = false }
roxmltree = "0.21.2"
serde_json = "1.0"
skrifa = { version = "0.49.0", default-features = false, features = ["std"] }
tiny-skia-path = "0.12.0"
unicode-segmentation = "1.13.3"
usvg = { version = "0.50.0", default-features = false, features = ["text"] }

[lints]
workspace = true
