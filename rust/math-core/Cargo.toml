[package]
name = "beautyxt-math-core"
version = "0.1.0"
description = "Bounded native math layout for an isolated BeauTyXT worker"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
beautyxt-illustration-core = { path = "../illustration-core" }
beautyxt-print-core = { path = "../print-core" }
ratex-types = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
# Force the same bundled, filesystem-free font path in debug and optimized workers.
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
skrifa = "0.47.0"
tiny-skia-path = "0.12.0"

[lints]
workspace = true
