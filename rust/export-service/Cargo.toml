[package]
name = "beautyxt-export-service"
version = "0.1.0"
build = "../native-service/build-service.rs"
description = "ART-free Android service for isolated BeauTyXT exports"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
beautyxt-export-core = { path = "../export-core" }
beautyxt-source-save-core = { path = "../source-save-core" }
libc = "0.2.191"
sha2 = { version = "0.11.1", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
beautyxt-native-service = { path = "../native-service" }

[lints]
workspace = true
